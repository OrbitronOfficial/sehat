[flake8]
max-line-length = 130
exclude = .git,__pycache__,.vercel,tools/demo_v3,tools/demo_v4,tools/demo_quick,tools/patch_demos.py
ignore = E731,W503,E402,E501,E127
per-file-ignores =
    tests/*:E501
    tools/*:E501
    clinic.py:E226,E306
    tests/test_clinic_v3.py:E128,E302

[tool:pytest]
testpaths = tests

[coverage:run]
omit =
    tests/*
    tools/*
