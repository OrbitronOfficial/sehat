<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>try{var th=localStorage.getItem("sehat_theme");if(th!=="dark"&&th!=="light")th=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=th}catch(e){document.documentElement.dataset.theme="light"}</script>
<meta name="theme-color" content="#0774C4">
<title>Sehat · Workspace</title>
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Outfit:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=10">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/" aria-label="Sehat home"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Sehat</span></a>
  <div class="top-right">
    <span class="pill" id="netChip"></span><span class="userchip" id="userChip"></span>
    <button type="button" class="themebtn" onclick="flipTheme()" aria-label="Switch theme">◐</button>
    <button class="btn sm ghost" onclick="logout()">Switch role</button>
  </div>
</header>
<div class="shell">
  <aside class="side">
    <div class="org" id="org"></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>
<div id="toast"></div>
<script>function flipTheme(){var t=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("sehat_theme",t)}catch(e){}}</script>
<script src="data.js?v=21"></script>
<script src="app.js?v=22"></script>
<script src="suites.js?v=21"></script>
<script src="journal.js?v=12"></script>
<script src="senior.js?v=2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js"></script>
<script>
// network status chip: shows whether this screen is live-synced with other devices in the same room
function paintNet(){var c=document.getElementById('netChip');if(!c||typeof Store==='undefined')return;var n=Store.cloud,t={live:['ok','● Live network'],connecting:['warn','◌ Connecting…'],error:['bad','● Offline · this device only'],off:['','● This device only']}[n.status]||['',''];c.className='pill '+t[0];c.textContent=t[1]+(n.status==='live'?' · room '+n.room:'');c.title='Every device that opens Sehat in room '+n.room+' shares the same live data. Join another room with ?room=NAME';}
addEventListener('sehat-cloud',paintNet);addEventListener('load',paintNet);
</script>
<script src="assistant.js?v=5"></script>
</body>
</html>
