<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>try{var th=localStorage.getItem("sehat_theme");if(th!=="dark"&&th!=="light")th=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=th}catch(e){document.documentElement.dataset.theme="light"}</script>
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
<title>Sehat · Live demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Outfit:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=9">
<style>
body{margin:0;height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.roles{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(7,116,196,.06);border:1px solid var(--line);flex-wrap:wrap}
.roles button{border:0;background:none;border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.roles button.on{background:var(--card-solid);color:var(--teal-dark);box-shadow:0 4px 14px -6px rgba(7,40,80,.3)}
.roles .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;background:var(--teal-tint);color:var(--teal-dark)}
.roles button.on .n{background:linear-gradient(135deg,#8EBEF9,#0774C4);color:#fff}
.roles .ping{width:8px;height:8px;border-radius:50%;background:#DC2626;display:none}.roles button.new .ping{display:block;animation:p 1s infinite alternate}@keyframes p{to{opacity:.3}}
.hint{padding:0 18px 8px;color:var(--muted);font-size:.9rem}.hint b{color:var(--teal-dark)}
.panes{flex:1;display:grid;grid-template-columns:1fr;gap:10px;padding:0 18px 14px;min-height:0}
.pane{display:none;flex-direction:column;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--card);min-height:0;box-shadow:var(--shadow)}
.pane.on{display:flex}.pane iframe{flex:1;border:0;width:100%;background:#fff}
.pane h3{margin:0;padding:9px 14px;font-size:14px;border-bottom:1px solid var(--line);display:none}
body.split .panes{grid-template-columns:repeat(4,1fr)}body.split .pane{display:flex}body.split .pane h3{display:block}
@media(max-width:900px){body.split .panes{grid-template-columns:1fr;overflow:auto}body.split .pane{min-height:560px}}
</style>
</head>
<body>
<div class="top topbar"><a class="brand" href="/" aria-label="Sehat home"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Sehat</span></a><span class="pill">● Live demo</span>
  <div class="roles" id="roles"></div>
  <span class="sp"></span>
  <button class="btn sm" id="autoBtn" onclick="autoPlay()">▶ Auto-play</button>
  <button class="btn sm ghost" id="splitBtn" onclick="toggleSplit()">⇆ Side by side</button>
  <button class="btn sm ghost" onclick="if(confirm('Reset the network demo data?')){localStorage.removeItem('sehat_db_v2');location.reload()}">Reset</button></div>
<style>
/* live stats: each number flips like a departure board when the network changes */
.stats{display:flex;gap:10px;padding:0 18px 10px;flex-wrap:wrap}
.stat2{flex:1;min-width:130px;display:flex;align-items:center;gap:10px;border-radius:16px;padding:8px 12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.stat2 .ic{font-size:20px}.stat2 small{display:block;color:var(--muted);font-size:.74rem;font-weight:600}
.num{display:inline-block;font-family:var(--display);font-weight:800;font-size:1.35rem;color:var(--teal-dark);perspective:300px}
.num.flipping{animation:flipn .6s cubic-bezier(.2,.8,.2,1)}@keyframes flipn{0%{transform:rotateX(0)}45%{transform:rotateX(90deg);opacity:.2}55%{transform:rotateX(-90deg);opacity:.2}100%{transform:rotateX(0)}}
.stat2.pulse{border-color:#8EBEF9;box-shadow:0 0 0 3px rgba(142,190,249,.4),var(--shadow)}
#autoBtn.on{background:linear-gradient(180deg,#EF4444,#DC2626)}
</style>
<div class="stats" id="stats"></div>
<p class="hint" id="hint"></p>
<div class="panes" id="panes"></div>
<script src="data.js?v=10"></script>
<script>
// One role on screen at a time. Every pane stays loaded in the background so the shared store keeps
// them in sync; a red dot marks a role whose screen changed since you last looked at it.
const STEPS = [
  ['doctor', '🩺', 'Doctor', 'app.html?role=doctor&view=sehat_doctor', 'Save the consult note, then sign the prescription. Sehat routes it to the nearest pharmacy with stock.'],
  ['pharmacy', '💊', 'Pharmacy', 'app.html?role=pharmacy&view=sehat_pharmacy', 'The prescription arrives with a stock check: accept, pack, send a rider. In Supply chain, draft POs and send them to the distributor.'],
  ['supplier', '🚚', 'Supplier', 'app.html?role=supplier&view=sehat_supply', 'Punjab Pharma gets the purchase order live: accept, dispatch, deliver. The pharmacy\'s stock goes up by itself.'],
  ['patient', '💚', 'Patient', '/login?demo=1', 'The patient sees the medicine moving from pharmacy to door, and it lands in their records.'],
];
let cur = 'doctor';
document.getElementById('roles').innerHTML = STEPS.map(([k, ic, l], i) => `<button data-k="${k}" onclick="show('${k}')"><span class="n">${i + 1}</span>${ic} ${l}<span class="ping"></span></button>`).join('');
document.getElementById('panes').innerHTML = STEPS.map(([k, ic, l, src]) => `<div class="pane" data-k="${k}"><h3>${ic} ${l}</h3><iframe src="${src}" title="${l}"></iframe></div>`).join('');
function show(k) {
  cur = k; const s = STEPS.find(x => x[0] === k);
  document.querySelectorAll('.roles button').forEach(b => { b.classList.toggle('on', b.dataset.k === k); if (b.dataset.k === k) b.classList.remove('new'); });
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.dataset.k === k));
  document.getElementById('hint').innerHTML = `<b>Step ${STEPS.indexOf(s) + 1} · ${s[2]}.</b> ${s[4]}`;
}
function toggleSplit() { const on = document.body.classList.toggle('split'); document.getElementById('splitBtn').textContent = on ? '▣ One at a time' : '⇆ Side by side'; }
// mark the role that a network change concerns, so the presenter knows where to click next
let seen = JSON.stringify(Store.db.prescriptions.map(p => p.status)) + JSON.stringify(Store.db.pos.map(p => p.status));
Store.onChange(() => {
  const d = Store.db, now = JSON.stringify(d.prescriptions.map(p => p.status)) + JSON.stringify(d.pos.map(p => p.status)); if (now === seen) return; seen = now;
  const rx = d.prescriptions[0], po = d.pos[0], who = new Set();
  if (rx && ['sent', 'query'].includes(rx.status)) who.add('pharmacy');
  if (rx && ['out for delivery', 'delivered', 'ready'].includes(rx.status)) who.add('patient');
  if (po && ['sent', 'accepted'].includes(po.status)) who.add('supplier');
  if (po && ['dispatched', 'delivered'].includes(po.status)) who.add('pharmacy');
  who.forEach(k => { if (k !== cur) document.querySelector(`.roles button[data-k="${k}"]`)?.classList.add('new'); });
});
show(new URLSearchParams(location.search).get('role') || 'doctor');
</script>
<style>
.dg{position:fixed;left:20px;bottom:20px;z-index:95;display:flex;align-items:flex-end;gap:10px;max-width:min(430px,calc(100vw - 40px))}
.dg img{width:74px;height:74px;border-radius:50%;background:#EAF3FE;border:3px solid #fff;box-shadow:0 14px 30px -12px rgba(7,40,80,.5);flex:none;animation:dgb 3s ease-in-out infinite}
@keyframes dgb{50%{transform:translateY(-5px)}}
.dg .bub{position:relative;background:var(--card-solid);border:1px solid var(--line);border-radius:20px 20px 20px 6px;padding:14px 16px;box-shadow:0 24px 50px -20px rgba(7,40,80,.45);animation:dgin .4s cubic-bezier(.2,.8,.2,1)}
@keyframes dgin{from{opacity:0;transform:translateY(10px) scale(.97)}}
.dg .bub b{font-family:var(--display);color:var(--teal-dark)}.dg .bub p{margin:6px 0 10px;font-size:.92rem;line-height:1.5}
.dg .bar{height:4px;border-radius:9px;background:var(--line);margin-bottom:10px;overflow:hidden}.dg .bar i{display:block;height:100%;background:linear-gradient(90deg,#8EBEF9,#0774C4);transition:width .4s}
.dg .wait{font-size:.8rem;color:var(--warn);font-weight:600}.dg .ok{font-size:.8rem;color:var(--ok);font-weight:700}
.dg .row{gap:6px}.dg.min .bub{display:none}
</style>
<div class="dg" id="dg"><img src="/saathi.svg" alt="Dr. Saathi, demo guide" onclick="dgEl.classList.toggle('min')" title="Show / hide the guide"><div class="bub" id="dgBub"></div></div>
<script>
// Dr. Saathi walks a presenter through the whole network, one role at a time. Each step switches to the
// right pane (and tab inside it), says what to do, and moves on by itself when the shared store shows it happened.
const dgEl = document.getElementById('dg'), frame = k => document.querySelector(`.pane[data-k="${k}"] iframe`)?.contentWindow;
const openTab = (k, suite, tab) => { try { frame(k).eval(`suiteTab.${suite}='${tab}';render()`); } catch (e) {} };
const rx0 = () => Store.db.prescriptions[0], po0 = () => Store.db.pos.find(p => p.supplier === ROLES.supplier.org);
const TOUR = [
  { role: 'doctor', t: 'Namaste! I am Dr. Saathi. I will walk you through Sehat, one role at a time. This is Dr. Bansal\'s clinic. In the Consult queue, tap "Save note → write prescription", then "Sign & send to pharmacy".', done: () => Store.db.prescriptions.length > dgStart.rx, wait: 'Waiting for the doctor to approve a prescription…' },
  { role: 'pharmacy', go: () => openTab('pharmacy', 'sehat_pharmacy', 'rxinbox'), t: 'The prescription just reached Jain Medicos, the nearest pharmacy with stock, with a live stock check. Tap Accept, then "Packed · mark ready".', done: () => ['ready', 'out for delivery', 'delivered'].includes(rx0()?.status), wait: 'Waiting for the pharmacist to pack it…' },
  { role: 'pharmacy', go: () => openTab('pharmacy', 'sehat_pharmacy', 'delivery'), t: 'Packed! Now hand it to a rider: tap "Assign rider". The patient gets the ETA instantly.', done: () => ['out for delivery', 'delivered'].includes(rx0()?.status), wait: 'Waiting for a rider to be assigned…' },
  { role: 'patient', t: 'Here is Rahul\'s app. His medicine tracker shows it on the way, and the prescription is already in his records. No queue at the counter.' },
  { role: 'pharmacy', go: () => openTab('pharmacy', 'sehat_pharmacy', 'supply'), t: 'Now the shelves. Supply Chain AI predicts what runs out first (see the AI insight). Tap "Draft POs", check them, then "Send to distributor".', done: () => po0() && po0().status !== 'draft', wait: 'Waiting for a purchase order to be sent…' },
  { role: 'supplier', go: () => openTab('supplier', 'sehat_supply', 'poinbox'), t: 'Punjab Pharma Distributors got the order live, sorted by urgency. Tap Accept, pick a vehicle, Dispatch, then Delivered.', done: () => po0()?.status === 'delivered', wait: 'Waiting for the delivery…' },
  { role: 'pharmacy', go: () => openTab('pharmacy', 'sehat_pharmacy', 'supply'), t: 'Delivered, and Jain Medicos\' stock went up by itself. Doctor → pharmacy → patient → distributor, all connected. That is Sehat!' },
];
let dgI = 0, dgVoice = false, dgStart = { rx: Store.db.prescriptions.length };
function dgSay(t) { if (!dgVoice || !('speechSynthesis' in window)) return; const u = new SpeechSynthesisUtterance(t); u.lang = 'en-IN'; speechSynthesis.cancel(); speechSynthesis.speak(u); }
function dgShow(i) {
  dgI = Math.max(0, Math.min(TOUR.length - 1, i)); const s = TOUR[dgI], r = STEPS.find(x => x[0] === s.role);
  show(s.role); setTimeout(() => s.go?.(), 400);
  const finished = s.done?.();
  document.getElementById('dgBub').innerHTML = `<div class="bar"><i style="width:${(dgI + 1) / TOUR.length * 100}%"></i></div>
    <b>Step ${dgI + 1} of ${TOUR.length} · ${r[1]} ${r[2]}</b><p>${s.t}</p>
    ${s.done ? `<div class="${finished ? 'ok' : 'wait'}">${finished ? '✓ Done! Tap Next.' : '⏳ ' + s.wait}</div>` : ''}
    <div class="row" style="margin-top:10px"><button class="btn sm ghost" onclick="dgShow(dgI-1)" ${dgI ? '' : 'disabled'}>← Back</button><button class="btn sm" onclick="dgShow(dgI+1)">${dgI === TOUR.length - 1 ? 'Finish' : 'Next →'}</button>
    <span class="sp"></span><button class="link" onclick="dgVoice=!dgVoice;dgVoice?dgSay(TOUR[dgI].t):speechSynthesis.cancel();this.textContent=dgVoice?'🔊':'🔇'" title="Read aloud">${dgVoice ? '🔊' : '🔇'}</button><button class="link" onclick="dgEl.classList.add('min')" title="Hide">✕</button></div>`;
  dgSay(s.t);
}
// when the step's action happens in any pane, cheer and move on
Store.onChange(() => { const s = TOUR[dgI]; if (s.done && s.done()) { const b = document.querySelector('#dgBub .wait'); if (b) { b.className = 'ok'; b.textContent = '✓ Done! Moving on…'; setTimeout(() => { if (TOUR[dgI] === s) dgShow(dgI + 1); }, 1600); } } });
// clicking a role tab yourself is fine; the guide stays on its step
dgShow(0);

// ---- live stats strip ----
const STATS = [
  ['📝', 'Prescriptions', d => d.prescriptions.length],
  ['🛵', 'Out / delivered', d => d.prescriptions.filter(p => ['out for delivery', 'delivered'].includes(p.status)).length],
  ['📦', 'Low-stock items', d => Object.values(d.stock).filter(s => s.qty < s.min).length],
  ['🚚', 'Purchase orders', d => d.pos.filter(p => p.status !== 'draft').length],
  ['📈', 'Units restocked', d => d.pos.filter(p => ['delivered', 'received'].includes(p.status)).flatMap(p => p.items).reduce((s, i) => s + i.q, 0)],
];
document.getElementById('stats').innerHTML = STATS.map(([ic, l], i) => `<div class="stat2" id="st${i}"><span class="ic">${ic}</span><div><span class="num">0</span><small>${l}</small></div></div>`).join('');
function drawStats() {
  STATS.forEach(([, , f], i) => { const box = document.getElementById('st' + i), n = box.querySelector('.num'), v = f(Store.db);
    if (String(v) === n.textContent) return;
    n.classList.remove('flipping'); void n.offsetWidth; n.classList.add('flipping'); box.classList.add('pulse');
    setTimeout(() => { n.textContent = v; }, 280); setTimeout(() => box.classList.remove('pulse'), 900); });
}
Store.onChange(drawStats); drawStats();

// ---- auto-play: Dr. Saathi runs the whole loop by itself, adding real data to the shared store step by step ----
let autoOn = false;
const nap = ms => new Promise(r => setTimeout(r, ms));
const inPane = (k, code) => { try { return frame(k).eval(code); } catch (e) { return null; } };
async function autoPlay() {
  if (autoOn) { autoOn = false; return; }
  autoOn = true; const btn = document.getElementById('autoBtn'); btn.classList.add('on'); btn.textContent = '■ Stop';
  const PATIENTS = ['Rahul Mehra', 'Sunita Mehra', 'Aman Verma'], pt = PATIENTS[Store.db.prescriptions.length % 3], rid = 'RX' + Math.random().toString(36).slice(2, 6).toUpperCase();
  const step = async (i, fn, wait = 2600) => { if (!autoOn) throw 0; dgShow(i); await nap(900); if (!autoOn) throw 0; fn(); await nap(wait); };
  try {
    await step(0, () => Store.update(d => {   // the doctor signs; the store routes it like SehatNet.routeRx does
      d.prescriptions.unshift({ id: rid, patient: pt, doctor: 'Dr. R. K. Bansal', dx: 'Viral fever', meds: [{ name: 'Paracetamol 650mg', dose: '1-0-1 × 5 days', qty: 10 }, { name: 'Cetirizine 10mg', dose: '0-0-1 × 5 days', qty: 5 }], pharmacy: 'Jain Medicos', km: 1.2, status: 'sent', t: Date.now(), rider: null });
      d.journal.unshift({ date: new Date().toISOString().slice(0, 10), type: 'Prescription', text: `Viral fever: Paracetamol 650mg, Cetirizine 10mg (Dr. R. K. Bansal)` });
    }, 'Dr. R. K. Bansal', `approved ${rid} for ${pt} → Jain Medicos (1.2 km)`));
    await step(1, () => { inPane('pharmacy', `rxAccept('${rid}')`); setTimeout(() => inPane('pharmacy', `rxReady('${rid}')`), 1200); }, 3200);
    await step(2, () => inPane('pharmacy', `dlSend('${rid}')`));
    await step(3, () => {}, 3200);
    await step(4, () => { inPane('pharmacy', 'poDraft()'); setTimeout(() => inPane('pharmacy', 'poSendAll()'), 1400); }, 3400);
    const pid = () => Store.db.pos.find(p => p.supplier === ROLES.supplier.org && !['delivered', 'received', 'draft'].includes(p.status))?.id;
    await step(5, () => { const p = pid(); if (!p) return; inPane('supplier', `spAccept('${p}')`);
      setTimeout(() => { inPane('supplier', `render()`); const v = inPane('supplier', `document.getElementById('veh_${p}')`); if (v) inPane('supplier', `spDispatch('${p}')`); }, 1300);
      setTimeout(() => inPane('supplier', `spDeliver('${p}')`), 2800); }, 4200);
    await step(6, () => {}, 1500);
  } catch (e) { /* stopped */ }
  autoOn = false; btn.classList.remove('on'); btn.textContent = '▶ Auto-play';
}
</script>
<script src="assistant.js?v=5"></script>
</body>
